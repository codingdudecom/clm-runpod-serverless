name: Publish optional Docker Hub image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (for example v0.1.0)
        required: true
        default: v0.1.0
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clm-runpod-serverless:${{ inputs.tag }}
