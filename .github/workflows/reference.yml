name: Published CLM heads on cloud CPU
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch on the GitHub runner
        run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==2.2.6 requests==2.32.5 huggingface-hub==0.35.3
      - name: Install CLM engine without GPU dependencies
        run: pip install --no-deps contrastive-lm==0.1.0
      - run: python tests/cpu_reference.py
